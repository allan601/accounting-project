<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics - Simple Accounting</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div style="display: flex; justify-content: space-between; align-items: center; max-width: 600px; margin: 0 auto 10px;">
            <h1 style="margin: 0;">💰 Simple Accounting</h1>
            <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Dark Mode">🌙</button>
        </div>
        <nav aria-label="Main Menu">
            <ul>
                <li><a href=" ">Home (Record)</a ></li>
                <li><a href="records.html">Records</a ></li>
                <li><a href="stats.html" aria-current="page">Statistics</a ></li>
                <li><a href="about.html">About</a ></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="form-card">
            <h2>📊 Data Analysis</h2>
            <p>Based on your current records, here is your spending overview:</p >
            <br>
            <div id="stats-content">
                <!-- JS will fill this -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Simple Accounting Project</p >
    </footer>

    <script>
        const STORAGE_KEY = 'accounting_records';
        const records = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        const statsEl = document.getElementById('stats-content');

        if (records.length === 0) {
            statsEl.innerHTML = '<p>No data available for analysis yet.</p >';
        } else {
            const count = records.length;
            const expenseRecords = records.filter(r => r.type === 'expense');
            let maxExpense = 0;
            
            expenseRecords.forEach(r => {
                if (r.amount > maxExpense) maxExpense = r.amount;
            });

            statsEl.innerHTML = `
                <ul style="list-style-type: none; line-height: 2;">
                    <li>📌 Total of <strong>${count}</strong> records found.</li>
                    <li>💸 Highest single expense: <strong style="color:var(--expense-color)">$${maxExpense.toFixed(2)}</strong></li>
                </ul>
            `;
        }

        // ========== Dark Mode Logic ==========
        const themeToggleBtn = document.getElementById('theme-toggle');
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            if (themeToggleBtn) themeToggleBtn.textContent = '☀️';
        }
        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                if (document.body.classList.contains('dark-mode')) {
                    themeToggleBtn.textContent = '☀️';
                    localStorage.setItem('theme', 'dark');
                } else {
                    themeToggleBtn.textContent = '🌙';
                    localStorage.setItem('theme', 'light');
                }
            });
        }
    </script>
</body>
</html>
