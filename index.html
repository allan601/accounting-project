<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Simple Accounting</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div style="display: flex; justify-content: space-between; align-items: center; max-width: 600px; margin: 0 auto 10px;">
            <h1 style="margin: 0;">💰 Simple Accounting</h1>
            <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Dark Mode">🌙</button>
        </div>
        <nav aria-label="Main Menu">
            <ul>
                <li><a href="index.html" aria-current="page">Home (Record)</a ></li>
                <li><a href="records.html">Records</a ></li>
                <li><a href="stats.html">Statistics</a ></li>
                <li><a href="about.html">About</a ></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <!-- Summary -->
        <section class="summary" aria-label="Account Summary">
            <div class="summary-item">
                <span>Total Balance</span>
                <strong class="balance" id="balance">0</strong>
            </div>
            <div class="summary-item">
                <span>Total Income</span>
                <strong class="income" id="income">0</strong>
            </div>
            <div class="summary-item">
                <span>Total Expense</span>
                <strong class="expense" id="expense">0</strong>
            </div>
        </section>

        <!-- Add Record Form -->
        <section class="form-card">
            <h2>Add New Record</h2>
            <form id="record-form">
                <div class="form-group">
                    <label for="date" class="sr-only">Date</label>
                    <input type="date" id="date" required>
                    
                    <label for="type" class="sr-only">Type</label>
                    <select id="type" required>
                        <option value="expense">Expense</option>
                        <option value="income">Income</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="amount" class="sr-only">Amount</label>
                    <input type="number" id="amount" placeholder="Amount" step="0.01" min="0" required>
                    
                    <label for="note" class="sr-only">Note</label>
                    <input type="text" id="note" placeholder="Note (Optional)">
                </div>
                <button type="submit">Add Record</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Simple Accounting Project</p >
    </footer>

    <script>
        // ========== Accounting Logic ==========
        const STORAGE_KEY = 'accounting_records';
        
        function getRecords() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        }

        function renderSummary() {
            const records = getRecords();
            let totalIncome = 0;
            let totalExpense = 0;
            
            records.forEach(record => {
                if (record.type === 'income') totalIncome += record.amount;
                else totalExpense += record.amount;
            });

            document.getElementById('balance').textContent = (totalIncome - totalExpense).toFixed(2);
            document.getElementById('income').textContent = totalIncome.toFixed(2);
            document.getElementById('expense').textContent = totalExpense.toFixed(2);
        }

        document.getElementById('record-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const records = getRecords();
            records.push({
                id: Date.now().toString(),
                date: document.getElementById('date').value,
                type: document.getElementById('type').value,
                amount: parseFloat(document.getElementById('amount').value),
                note: document.getElementById('note').value.trim()
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            renderSummary();
            
            document.getElementById('amount').value = '';
            document.getElementById('note').value = '';
            alert('Record added successfully! Go to "Records" to view.');
        });

        document.getElementById('date').valueAsDate = new Date();
        renderSummary();

        // ========== Dark Mode Logic ==========
        const themeToggleBtn = document.getElementById('theme-toggle');
        
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            if (themeToggleBtn) themeToggleBtn.textContent = '☀️';
        }

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                
                if (document.body.classList.contains('dark-mode')) {
                    themeToggleBtn.textContent = '☀️';
                    localStorage.setItem('theme', 'dark');
                } else {
                    themeToggleBtn.textContent = '🌙';
                    localStorage.setItem('theme', 'light');
                }
            });
        }
    </script>
</body>
</html>
