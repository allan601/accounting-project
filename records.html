<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消費明細 - 簡易記帳本</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>💰 簡易記帳本</h1>
        <nav aria-label="主選單">
            <ul>
                <li><a href=" ">首頁 (記帳)</a ></li>
                <li><a href="records.html" aria-current="page">消費明細</a ></li>
                <li><a href="stats.html">統計圖表</a ></li>
                <li><a href="about.html">關於本站</a ></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section>
            <div class="list-header">
                <h2>📝 消費明細</h2>
            </div>
            <ul class="record-list" id="record-list">
                <!-- 記錄將由 JS 動態生成 -->
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 簡易記帳本作業</p >
    </footer>

    <script>
        const STORAGE_KEY = 'accounting_records';
        
        function getRecords() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        }

        function renderList() {
            const records = getRecords();
            const listEl = document.getElementById('record-list');
            
            // 按日期倒序
            records.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            listEl.innerHTML = '';
            if (records.length === 0) {
                listEl.innerHTML = '<li class="empty-msg">暫無記錄，請回首頁新增您的第一筆帳目！</li>';
                return;
            }

            records.forEach(record => {
                const li = document.createElement('li');
                li.className = `record-item ${record.type}`;
                const sign = record.type === 'income' ? '+' : '-';
                
                li.innerHTML = `
                    <div class="record-info">
                        <span class="record-date">${record.date}</span>
                        <span class="record-note">${record.note || '無備註'}</span>
                    </div>
                    <div class="record-action">
                        <span class="record-amount ${record.type}">${sign}${record.amount.toFixed(2)}</span>
                        <button class="delete-btn" onclick="deleteRecord('${record.id}')">刪除</button>
                    </div>
                `;
                listEl.appendChild(li);
            });
        }

        // 交互元素：删除功能
        function deleteRecord(id) {
            if (!confirm('確定要刪除此筆記錄嗎？')) return;
            let records = getRecords();
            records = records.filter(record => record.id !== id);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            renderList();
        }

        renderList();
    </script>
</body>
</html>
